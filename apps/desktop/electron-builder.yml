appId: com.nolira.build
productName: Nolira Build
copyright: Copyright © 2026 Nolira Build contributors

directories:
  buildResources: resources/installer
  output: release/${version}

files:
  - out/**
  - package.json

extraResources:
  - from: resources/runtime
    to: runtime
    filter:
      - "**/*"
  - from: resources/licenses
    to: licenses
    filter:
      - "**/*"

asar: true
asarUnpack:
  - "**/resources/runtime/**"

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

mac:
  icon: resources/installer/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  sign: false

win:
  icon: resources/installer/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  icon: resources/installer/icon.png
  category: Development
  maintainer: Nolira Build contributors
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64

publish: null
