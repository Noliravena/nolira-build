[package]
name = "nolira-build-desktop"
version = "0.1.0"
description = "Grok-first desktop coding workspace"
authors = ["Nolira"]
edition = "2021"
publish = false

[lib]
name = "nolira_build_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
mime_guess = "2.0.5"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
which = "8"

[dev-dependencies]
tempfile = "3"
